name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Docs-only changes skip the build jobs (ADR 0030). "Changed" is measured from the last commit whose hosted
    # jobs passed, so a docs push that cancels a code push's run still builds that code.
    name: Detect code changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: tools/ci/code_changed.sh "$EVENT" "$PR_BASE" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint (hygiene, format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Repo hygiene (backlog ids, CLAUDE.md, veach names in apps/)
        run: python3 tools/scripts/check_repo.py
      - name: "No flecs:: in apps/"
        run: |
          if grep -rn "flecs::" apps/; then
            echo "::error::apps/ must use veach:: names (veach::World, veach::Entity, ...), never flecs::"
            exit 1
          fi
      - name: clang-format
        run: |
          pip install clang-format==23.1.5
          git ls-files '*.cpp' '*.hpp' '*.h' '*.mm' '*.inl' | xargs clang-format --dry-run --Werror

  gpu:
    # Real-GPU golden images on the self-hosted Mac (docs/guides/ci-runners.md, VCH-044).
    # Never on pull_request: a self-hosted runner must not run code from forks.
    # When the Mac is asleep or off the job stays queued (GitHub keeps it up to 24 h) instead of failing.
    name: macOS GPU (Metal goldens, self-hosted)
    needs: changes
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.code == 'true'
    runs-on: [self-hosted, macOS, ARM64, gpu-metal]
    permissions:
      contents: read
    env:
      VEACH_REQUIRE_GPU: "1"  # a skipped golden is a failure here
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - name: Configure
        run: cmake --preset debug
      - name: Build
        run: cmake --build --preset debug
      - name: Test (everything, GPU goldens required)
        run: ctest --preset debug

  build:
    name: ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Debug, ASan + UBSan)
            os: macos-15
            preset: asan
          - name: macOS (Debug, leak checks)
            os: macos-15
            preset: leaks
          - name: Windows (Debug, MSVC, DX12 stub + null RHI)
            os: windows-2025
            preset: debug
    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true  # golden images (tests/golden/) live in Git LFS
      - uses: lukka/get-cmake@latest
      - name: MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-${{ matrix.preset }}
          max-size: 1G
      - name: Cache dependency sources
        uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/VeachDependencies.cmake') }}
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      # GPU golden tests report SKIPPED here: hosted runners have a paravirtual GPU without Metal 3 /
      # ray tracing (docs/specs/first-light/spec.md, VCH-044). Windows compiles every shader to DXIL.
      - name: Test (unit, hello world, luau-analyze, generated files, goldens, hygiene)
        run: ctest --preset ${{ matrix.preset }}
