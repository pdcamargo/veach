name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Docs-only changes skip the build jobs (ADR 0032). "Changed" is measured from the last commit whose hosted
    # jobs passed, so a docs push that cancels a code push's run still builds that code.
    name: Detect code changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: tools/ci/code_changed.sh "$EVENT" "$PR_BASE" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint (hygiene, format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Repo hygiene (backlog ids, CLAUDE.md, veach names in apps/)
        run: python3 tools/scripts/check_repo.py
      - name: "No flecs:: in apps/"
        run: |
          if grep -rn "flecs::" apps/; then
            echo "::error::apps/ must use veach:: names (veach::World, veach::Entity, ...), never flecs::"
            exit 1
          fi
      - name: clang-format
        run: |
          pip install clang-format==23.1.5
          git ls-files '*.cpp' '*.hpp' '*.h' '*.mm' '*.inl' | xargs clang-format --dry-run --Werror

  build:
    name: ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Debug, ASan + UBSan)
            os: macos-15
            preset: asan
          - name: macOS (Debug, leak checks)
            os: macos-15
            preset: leaks
          - name: Windows (Debug, MSVC, DX12 on WARP)
            os: windows-2025
            preset: debug
            require_gpu: "1"  # DX12 goldens run on WARP (ADR 0033): a skip is a failure
            hosted_windows: "1"  # tests/cmake/windowed_test.cmake: the runner's Present quirk (VCH-050)
    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache
      LFS_INCLUDE: tests/golden/**,apps/lab/assets/cornell_box/**,apps/lab/assets/flight_helmet/**,apps/lab/assets/thin_triangles/**
      VEACH_REQUIRE_GPU: ${{ matrix.require_gpu || '0' }}
      VEACH_CI_HOSTED_WINDOWS: ${{ matrix.hosted_windows || '0' }}
    steps:
      - uses: actions/checkout@v5
      # Only the Git LFS files CI's tests read: the large scenes (Bistro, Sponza) stay out of CI's bandwidth and
      # run in the pre-push gate (ADR 0034). Every download counts against the account's LFS bandwidth, so the
      # objects are cached, keyed on the list of those files: a run downloads only what changed since the cache.
      - name: List Git LFS files used by CI
        shell: bash
        run: git lfs ls-files --long --include="$LFS_INCLUDE" | cut -d' ' -f1 | sort > .lfs-ci-objects
      - name: Cache Git LFS objects
        uses: actions/cache@v4
        with:
          path: .git/lfs/objects
          key: lfs-${{ runner.os }}-${{ hashFiles('.lfs-ci-objects') }}
          restore-keys: lfs-${{ runner.os }}-
      - name: Fetch Git LFS files used by CI
        shell: bash
        run: git lfs pull --include="$LFS_INCLUDE"
      - uses: lukka/get-cmake@latest
      - name: MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-${{ matrix.preset }}
          max-size: 1G
      - name: Cache dependency sources
        uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/VeachDependencies.cmake') }}
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      # Metal goldens report SKIPPED on hosted macOS (a paravirtual GPU without Metal 3 / ray tracing; the
      # pre-push gate runs them on a real Mac, ADR 0034). Windows runs the DX12 goldens on WARP and requires them.
      - name: Test (unit, hello world, luau-analyze, generated files, goldens, hygiene)
        run: ctest --preset ${{ matrix.preset }}
